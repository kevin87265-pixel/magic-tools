<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<title>紫微斗數速查 | 神奇身心靈學苑</title>
<style>
:root{
  color-scheme: dark;
  --bg:#1b1b2b; --bg2:#232338; --card:#26263e; --card2:#2d2d48;
  --gold:#d4af37; --gold-soft:#e8cd6f; --ink:#f0ead8; --ink2:#cfc7ae;
  --line:#3d3d5c; --accent:#8a7ff0; --danger:#e0707a; --ok:#7fc98f;
  --fs-body:15px; --fs-num:17px; --fs-h:30px;
}
html.light{
  color-scheme: light;
  --bg:#f5f1e6; --bg2:#ece6d4; --card:#ffffff; --card2:#f7f3e8;
  --gold:#9a7a10; --gold-soft:#7a610d; --ink:#2a2418; --ink2:#5a5240;
  --line:#d8d0ba; --accent:#5a4fc0; --danger:#b23a46; --ok:#2e7d4f;
}
html.big{ --fs-body:18px; --fs-num:20px; --fs-h:34px; }
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Source Han Sans TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:var(--fs-body); line-height:1.75; min-height:100vh;
}
header{
  padding:26px 16px 14px; text-align:center;
  background:linear-gradient(180deg,var(--bg2),var(--bg));
  border-bottom:1px solid var(--line);
}
header h1{font-size:var(--fs-h); letter-spacing:.14em; color:var(--gold); font-weight:700}
header p{color:var(--ink2); font-size:calc(var(--fs-body) - 1px); margin-top:4px; letter-spacing:.08em}
.toggles{position:fixed; top:10px; right:10px; display:flex; gap:6px; z-index:50}
.toggles button{
  background:var(--card); color:var(--ink); border:1px solid var(--line);
  border-radius:8px; padding:5px 10px; cursor:pointer; font-size:13px;
}
.toggles button:hover{border-color:var(--gold)}
.searchbar{max-width:920px; margin:14px auto 0; padding:0 14px}
.searchbar input{
  width:100%; padding:11px 16px; border-radius:12px; border:1px solid var(--line);
  background:var(--card); color:var(--ink); font-size:var(--fs-body); outline:none;
}
.searchbar input:focus{border-color:var(--gold)}
nav{
  display:grid; grid-template-columns:repeat(5,1fr); gap:7px; padding:12px 14px; max-width:920px; margin:0 auto;
}
@media (min-width:640px){ nav{grid-template-columns:repeat(10,1fr)} }
nav button{
  padding:7px 4px; text-align:center; border-radius:20px; border:1px solid var(--line);
  background:var(--card); color:var(--ink2); cursor:pointer; font-size:var(--fs-body);
  letter-spacing:.05em; white-space:nowrap;
}
nav button.on{background:var(--gold); color:#1b1b2b; border-color:var(--gold); font-weight:700}
main{max-width:920px; margin:0 auto; padding:6px 14px 70px}
section{display:none}
section.on{display:block}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; margin-top:10px}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 16px 14px;
}
.card h3{color:var(--gold); font-size:calc(var(--fs-body) + 4px); letter-spacing:.1em; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.card h3 small{color:var(--ink2); font-size:calc(var(--fs-body) - 2px); letter-spacing:.04em; font-weight:400}
.tags{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 6px}
.tag{
  font-size:calc(var(--fs-body) - 2px); padding:2px 10px; border-radius:12px;
  background:var(--card2); border:1px solid var(--line); color:var(--gold-soft);
}
.tag.k{color:var(--accent)}
.card p{color:var(--ink); margin-top:6px}
.card p b{color:var(--gold-soft)}
.card .sub{color:var(--ink2); font-size:calc(var(--fs-body) - 1px); margin-top:8px}
.note{
  margin:12px 0 4px; padding:10px 14px; border-left:3px solid var(--gold);
  background:var(--card2); border-radius:0 10px 10px 0; color:var(--ink2);
  font-size:calc(var(--fs-body) - 1px);
}
table{width:100%; border-collapse:collapse; margin-top:12px; background:var(--card); border-radius:12px; overflow:hidden}
th,td{border:1px solid var(--line); padding:7px 6px; text-align:center; font-size:var(--fs-body)}
th{background:var(--card2); color:var(--gold); letter-spacing:.06em}
td:first-child,th:first-child{color:var(--gold-soft); font-weight:700; position:sticky; left:0; background:var(--card2)}
.tablewrap{overflow-x:auto; border-radius:12px; border:1px solid var(--line)}
.b-廟{color:var(--ok); font-weight:700}
.b-旺{color:var(--gold-soft); font-weight:700}
.b-得,.b-利{color:var(--ink)}
.b-平{color:var(--ink2)}
.b-陷{color:var(--danger); font-weight:700}
.hua{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; margin-top:10px}
.hua .card h3{justify-content:center}
.hua .row{display:flex; justify-content:space-between; margin-top:6px; padding:4px 8px; border-radius:8px; background:var(--card2)}
.hua .row span:first-child{color:var(--ink2)}
.hua .lu{color:var(--ok)} .hua .quan{color:var(--gold-soft)} .hua .ke{color:var(--accent)} .hua .ji{color:var(--danger)}
.frow{display:flex; gap:10px; margin-top:6px; align-items:baseline}
.flab{flex:0 0 auto; font-size:calc(var(--fs-body) - 2px); color:var(--gold-soft); border:1px solid var(--line); background:var(--card2); border-radius:8px; padding:1px 8px}
.frow span:last-child{color:var(--ink2)}
.frow.good span:last-child{color:var(--ok)}
.frow.bad span:last-child{color:var(--danger)}
.sechead{color:var(--gold); font-size:calc(var(--fs-body) + 5px); letter-spacing:.12em; margin:22px 4px 4px; padding-left:10px; border-left:4px solid var(--gold)}
.card.xg h3{color:var(--danger)}
.card.xg .tag{color:var(--danger)}
ol.steps{margin:10px 0 0 24px}
ol.steps li{margin:8px 0; color:var(--ink)}
footer{text-align:center; color:var(--ink2); padding:20px; font-size:13px; border-top:1px solid var(--line)}
.hide{display:none !important}
tr.hide{display:none !important}
@media (max-width:520px){ header h1{font-size:calc(var(--fs-h) - 6px)} }

/* ══ 開場特效 ══ */
#splash{position:fixed; inset:0; z-index:999; background:#16162a; overflow:hidden; touch-action:none;
  font-family:"Source Han Sans TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
#splash .sp-aurora{position:absolute; inset:-25%; filter:blur(80px); opacity:.5; pointer-events:none}
#splash .sp-aurora i{position:absolute; border-radius:50%}
#splash .sp-aurora i:nth-child(1){width:60vmax;height:60vmax; left:-14%; top:-18%;
  background:radial-gradient(circle,#3d3387 0%,transparent 62%); animation:spd1 18s ease-in-out infinite alternate}
#splash .sp-aurora i:nth-child(2){width:50vmax;height:50vmax; right:-15%; bottom:-20%;
  background:radial-gradient(circle,#6b4fc4 0%,transparent 62%); animation:spd2 22s ease-in-out infinite alternate}
#splash .sp-aurora i:nth-child(3){width:36vmax;height:36vmax; right:5%; top:-12%;
  background:radial-gradient(circle,#8a6b16 0%,transparent 66%); animation:spd3 15s ease-in-out infinite alternate}
@keyframes spd1{to{transform:translate(10vmax,8vmax) scale(1.18)}}
@keyframes spd2{to{transform:translate(-9vmax,-7vmax) scale(1.12)}}
@keyframes spd3{to{transform:translate(-7vmax,9vmax) scale(1.25)}}
#sp-c{position:absolute; inset:0; display:block}
#splash .sp-ui{position:absolute; left:0; right:0; bottom:8vh; text-align:center; pointer-events:none}
#splash .sp-sub{font-size:clamp(15px,4vmin,20px); letter-spacing:.55em; padding-left:.55em; color:#e8cd6f;
  opacity:0; transform:translateY(18px); transition:1s ease}
#splash .sp-org{margin-top:9px; font-size:clamp(12px,3vmin,14px); letter-spacing:.3em; padding-left:.3em; color:#9a927c;
  opacity:0; transform:translateY(18px); transition:1s ease .15s}
#sp-btn{pointer-events:auto; margin-top:26px; opacity:0; transform:translateY(18px); transition:1s ease .3s;
  background:rgba(212,175,55,.1); color:#e8cd6f; border:1px solid rgba(212,175,55,.6); border-radius:999px;
  padding:12px 50px; font-size:16px; letter-spacing:.32em; padding-left:calc(50px + .32em);
  cursor:pointer; backdrop-filter:blur(4px); animation:sppulse 2.6s ease infinite}
@keyframes sppulse{0%,100%{box-shadow:0 0 22px rgba(212,175,55,.15), inset 0 0 16px rgba(212,175,55,.07)}
 50%{box-shadow:0 0 44px rgba(212,175,55,.4), inset 0 0 24px rgba(212,175,55,.14)}}
#sp-btn:active{background:rgba(212,175,55,.24)}
#splash.ready .sp-sub,#splash.ready .sp-org,#splash.ready #sp-btn{opacity:1; transform:none}
#splash .sp-hint{position:absolute; top:5.5vh; left:0; right:0; text-align:center;
  font-size:12px; letter-spacing:.42em; padding-left:.42em; color:#7d77a0;
  opacity:0; transition:1.2s ease .6s; pointer-events:none}
#splash.ready .sp-hint{opacity:.95}
#splash.leave{transition:opacity .6s ease; opacity:0}
</style>
</head>

["工作該不該換？","官祿宮為主，遷移宮看外出機會。星性對照四大類型給方向（順性而為）；流年官祿或命宮逢四化引動＝異動之年，忌入官祿防職場是非。"],
["感情桃花怎麼看？","夫妻宮主對待模式。大桃花是貪狼、廉貞；天姚是性桃花、玩玩的；咸池是一定會被發現的桃花，也是桃花煞。遷移有桃花＝外出遇到。破軍在夫妻宮不利婚姻，破軍＋咸池更容易離婚。"],
["什麼時候結婚？","流年太歲走到本命紅鸞天喜的宮位，或流年鸞喜入命宮／夫妻宮，且夫妻三方無重煞沖破＝婚喜訊號年。中晚年逢鸞喜引動，轉論刑傷孝服或再婚桃花，不可一律斷喜。"],
["身體健康？","疾厄宮本宮坐星五行對臟腑（木肝火心土脾胃金肺水腎），父母宮沖照看遺傳與家族病史，兄弟田宅有煞忌會照才加重——查「疾厄」頁徵驗表，提醒保健、不做醫學診斷。"],
["考試考得上嗎？","出社會前讀書考試參考官祿宮；看文昌、化科、天魁有沒有落入命宮或官祿的三方四正。文昌化忌學科不利、文曲化忌術科不利；陽梁昌祿為典型考試格。"],
["投資合夥看哪裡？","事業投資夥伴→僕役（交友）宮；有參與經營→官祿宮；有參與且每天工作→財帛宮；沒有參與經營→福德宮。先問清楚參與程度再定宮。"],
["能不能買房？","田宅宮為主；太陰主不動產，田宅逢祿主置產順利，逢忌煞防產權糾紛、漏水嫌隙。田宅也是財之庫，看一生成果收藏。"],
["會不會有官司？","官非看官符、天刑會照；天相被刑忌夾印主契約出問題、用印惹禍、作保出事（查「夾宮」頁引動年干）。簽約年份逢引動，提醒條款看清楚。"],
["適合外出發展嗎？","遷移宮強於命宮＝出外得志。天馬、歲驛主變動搬遷；祿馬交馳動中得財、利遠地；馬遇空亡終身奔走、勞而少獲。"],

["小孩緣分？","子女宮看子女緣分、個性與教養方式；子女宮也是桃花與合夥下游位，問不孕、意外時同參田宅氣數。"]

const GUIDE = [
{t:"① 先看本命命宮——一輩子的底",tag:"定性",
 d:"本命盤管一輩子，命宮主星解釋這個人的<b>內心狀況</b>——他是誰、怎麼想事情。依序看四件事：<br><b>1.</b> 主星是誰 → 查「十四主星」頁，先講人物形象與個性直述；<br><b>2.</b> 屬四大類型何者（開創／領導／支援／合作）→ 抓行事風格底色；<br><b>3.</b> 廟旺狀態（App 已標示）→ 廟旺＝星性<b>顯性</b>，特質明顯外放；落陷＝星性<b>隱性</b>，特質潛藏不易展現——不是沒有，是收在裡面；<br><b>4.</b> 命宮有無生年四化、吉星煞星同宮 → 祿忌坐命定一生得失基調。"},
{t:"② 三方四正四格合看——有比重",tag:"定強弱",
 d:"命宮＋對宮（遷移）＋三合二宮（財帛、官祿）共四格合參，<b>比重不是平均分</b>：<br><b>本宮 50%</b>｜<b>對宮 30%</b>｜<b>三合二宮各 10%</b><br>本宮是「你自己」，對宮是「迎面而來的環境」，三合是「你的手腳舞台」。會照的吉星煞星依這個比重加減分——同樣一顆擎羊，坐本宮的力道遠大於三合會照。四格看完順手檢查有無成局：機月同梁、殺破狼、府相朝垣（詳「格局」頁）。"},
{t:"③ 順著主星優勢走——解盤的目的",tag:"定方向",

<script>

const TABS = [

 {id:"jiefa", label:"解法"},

 {id:"stars", label:"主星"},
 {id:"palaces", label:"十二宮"},
 {id:"silu", label:"祿忌"},

 {id:"jia", label:"夾宮"},

];
const nav = document.getElementById("nav");
const main = document.getElementById("main");

TABS.forEach((t,i)=>{
  const b = document.createElement("button");
  b.textContent = t.label; b.dataset.tab = t.id;
  if(i===0) b.classList.add("on");
  b.onclick = ()=>{
    document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    document.querySelectorAll("main section").forEach(s=>s.classList.toggle("on", s.id===t.id));
    localStorage.setItem("zw_tab", t.id);
    document.getElementById("q").dispatchEvent(new Event("input"));
  };
  nav.appendChild(b);
});

function card(title, small, tags, body, sub){
  return `<div class="card" data-q="${(title+small+tags.join("")+body+(sub||"")).replace(/<[^>]+>/g,"").replace(/"/g,"")}">
    <h3>${title}<small>${small}</small></h3>
    ${tags.length?`<div class="tags">${tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>`:""}
    <p>${body}</p>${sub?`<p class="sub">⚠ ${sub}</p>`:""}
  </div>`;
}

/* 主星 */
let html = `<section id="guide" class="on"><div class="note" style="text-align:center;color:var(--gold)">看盤順序：本命定性 → 三方四正定強弱 → 順星性定方向 → 空宮借星 → 逐宮解釋 → 大限流年</div><div class="grid" style="grid-template-columns:1fr">`;
GUIDE.forEach(g=>{ html += card(g.t,"",[g.tag],g.d); });
html += `</div></section>`;

html += `<section id="stars"><div class="grid" style="grid-template-columns:1fr">`;
STARS.forEach(s=>{
  html += `<div class="card" data-q="${s.n}${s.def}${s.person}${s.event}${s.desc}${s.pros}${s.cons}">
    <h3>${s.n}<small>${s.def}</small></h3>
    <div class="frow"><span class="flab">人物形象</span><span>${s.person}</span></div>
    <div class="frow"><span class="flab">事件形象</span><span>${s.event}</span></div>
    <p style="margin-top:10px">${s.desc}</p>
    <div class="frow good"><span class="flab">優　點</span><span>${s.pros}</span></div>
    <div class="frow bad"><span class="flab">缺　點</span><span>${s.cons}</span></div>
  </div>`;
});
html += `</div></section>`;

/* 十二宮 */
html += `<section id="palaces"><div class="note">三方四正合看：本宮＋對宮＋三合二宮；本對為體、三合為用。</div><div class="grid">`;
PALACES.forEach(p=>{ html += card(p.n, "", [], p.d); });

/* 解法 */
html += `<section id="jiefa">
<div class="note" style="text-align:center;font-size:calc(var(--fs-body)+1px);color:var(--gold)">判斷順序：${JIEFA.order}</div>
<h2 class="sechead">解星六步</h2><div class="grid">`;
JIEFA.steps.forEach(x=>{ html += card(x.t,"",[],x.d); });
html += `</div><h2 class="sechead">命格四大類型（動態）</h2><div class="grid">`;
JIEFA.types.forEach(x=>{ html += card(x.t, x.m, ["類型"], `<b>放大優勢</b>　${x.a}`, null).replace("</p>", `</p><p class="sub"><b>特質</b>　${x.x}</p>`); });
html += `</div><div class="note">${JIEFA.close}</div></section>`;

/* 化祿化忌 */
html += `<section id="silu">
<h2 class="sechead">四化性質總論</h2><div class="grid">`;
JIEFA.sihua.forEach(x=>{ html += card(x.t,"",["四化"],x.g,null).replace("</p>", `</p><p class="sub">${x.m}</p>`).replace("⚠ ",""); });

<div class="tablewrap"><table><thead><tr><th style="min-width:150px">星曜化祿</th><th>狀況</th></tr></thead><tbody>`;
JIEFA.hualu.forEach(r=>{ html += `<tr class="jrow" data-q="${r[0]}${r[1]}"><td style="color:var(--ok)">${r[0]}</td><td style="text-align:left;padding-left:12px">${r[1]}</td></tr>`; });
html += `</tbody></table></div>

<div class="note" style="text-align:center;color:var(--gold)">疾厄宮怎麼看：先本宮、再對宮、後三合</div>

<div class="note" style="border-left-color:var(--danger)">徵驗訊號是傳統經驗的「傾向與保健提醒」，不是醫學診斷；重症條目為古訣所載，僅供參考，身體狀況一律以醫療檢查為準。</div>

<div class="note" style="text-align:center;font-size:calc(var(--fs-body)+1px);color:var(--gold)">「${JIAGONG.motto}」</div>
<h2 class="sechead">核心邏輯</h2><div class="grid">`;

html += `</div><h2 class="sechead">三個必懂觀念</h2><div class="grid">`;

<h2 class="sechead">吉格</h2><div class="grid">`;
GEJU_JI.forEach(g=>{ html += card(g.n,"",["吉格"],`<b>${g.c}</b><br>${g.d}`); });
html += `</div><h2 class="sechead" style="color:var(--danger)">凶格</h2><div class="grid">`;
GEJU_XIONG.forEach(g=>{ html += card(g.n,"",["凶格"],`<b>${g.c}</b><br>${g.d}`).replace('class="card"','class="card xg"'); });
html += `</div></section>`;

/* 常問 */
html += `<section id="faq"><div class="note">客人開口的第一句話，決定你先翻哪一宮——先定宮，再走解法六步。</div><div class="grid" style="grid-template-columns:1fr">`;
FAQ.forEach(f=>{ html += card(f[0],"",["常問"],f[1]); });
html += `</div></section>`;

main.innerHTML = html;

/* 搜尋 */
document.getElementById("q").addEventListener("input", e=>{
  const q = e.target.value.trim();
  const active = document.querySelector("main section.on");
  if(!q){ document.querySelectorAll(".card, .jrow").forEach(c=>c.classList.remove("hide")); return; }
  active.querySelectorAll(".card, .jrow").forEach(c=>{
    c.classList.toggle("hide", !(c.dataset.q||"").includes(q));
  });
});

/* 主題切換 */
const root = document.documentElement;
function syncMeta(){
  document.querySelector('meta[name="color-scheme"]').content = root.classList.contains("light") ? "light dark" : "dark light";
}
document.getElementById("tgTheme").onclick = ()=>{
  root.classList.toggle("light");
  localStorage.setItem("zw_theme", root.classList.contains("light") ? "light" : "dark");
  syncMeta();
};
document.getElementById("tgFont").onclick = ()=>{
  root.classList.toggle("big");
  localStorage.setItem("zw_font", root.classList.contains("big") ? "big" : "normal");
};
if(localStorage.getItem("zw_theme")==="light") root.classList.add("light");
if(localStorage.getItem("zw_font")==="big") root.classList.add("big");
syncMeta();
const savedTab = localStorage.getItem("zw_tab");
if(savedTab){
  const b = document.querySelector(`nav button[data-tab="${savedTab}"]`);
  if(b) b.click();
}
</script>
<script>
(function(){
  const spToday = new Date().toDateString();
  if(localStorage.getItem("zw_splash") === spToday){
    document.getElementById("splash").remove();
    return;                                   /* 今天播過，直接進主頁 */
  }
  localStorage.setItem("zw_splash", spToday);
  document.body.style.overflow="hidden";
let spStop=false;

const cv = document.getElementById("sp-c"), ctx = cv.getContext("2d");
const DPR = Math.min(devicePixelRatio || 1, 2);
let W, H;

/* ── 字形取樣 ── */
function samplePoints(){
  const off = document.createElement("canvas");
  const octx = off.getContext("2d");
  off.width = W; off.height = H;
  const vertical = innerWidth < 560;
  const fs = vertical ? Math.min(W*0.42, H*0.155) : Math.min(W*0.19, H*0.34);
  octx.fillStyle = "#fff";
  octx.font = `900 ${fs}px "Source Han Sans TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif`;
  octx.textAlign = "center"; octx.textBaseline = "middle";
  const chars = "紫微斗數";
  if(vertical){
    const cy = H*0.40, gap = fs*1.06;
    [...chars].forEach((ch,i)=> octx.fillText(ch, W/2, cy + (i-1.5)*gap));
  }else{
    const gap = fs*1.08, cx = W/2, cy = H*0.44;
    [...chars].forEach((ch,i)=> octx.fillText(ch, cx + (i-1.5)*gap, cy));
  }
  const img = octx.getImageData(0,0,W,H).data;
  const step = Math.max(3, Math.round(3.6*DPR));
  const pts = [];
  for(let y=0; y<H; y+=step)
    for(let x=0; x<W; x+=step)
      if(img[(y*W+x)*4+3] > 128) pts.push({x,y});
  return pts;
}

/* ── 粒子 ── */
const GOLD = ["#ffe9a8","#e8cd6f","#d4af37"], VIO = ["#c2b0ff","#9d8ef2"];
let parts = [], waves = [], meteors = [];
const T_VORTEX = 1650, T_BLAST = 1950;  /* 星盤→爆發→聚字 */

function build(){
  W = cv.width = innerWidth*DPR; H = cv.height = innerHeight*DPR;
  const targets = samplePoints();
  const vertical = innerWidth < 560;
  parts = targets.map(t=>{
    const prog = vertical ? t.y/H : t.x/W;      /* 波浪式聚字 */
    return {
      ca: Math.random()*Math.PI*2,
      cr: Math.random()*Math.min(W,H)*0.055,
      sp: 0.003 + Math.random()*0.004,
      x: W/2, y: H/2,
      vx:0, vy:0, tx:t.x, ty:t.y,
      c: Math.random()<0.78 ? GOLD[(Math.random()*3)|0] : VIO[(Math.random()*2)|0],
      r: (Math.random()*1.1+0.7)*DPR,
      d: T_BLAST + 150 + prog*750 + Math.random()*120
    };
  });
}
build();
let rebuildTimer;
addEventListener("resize", ()=>{ clearTimeout(rebuildTimer); rebuildTimer=setTimeout(build,200); });

/* ── 衝擊波 ── */
function shockwave(x,y,max,alpha){ waves.push({x,y,r:0,max,alpha}); }

/* ── 流星 ── */
function spawnMeteor(){
  const fromTop = Math.random()<0.5;
  meteors.push({
    x: Math.random()*W*0.8, y: fromTop? -20 : Math.random()*H*0.3,
    vx:(5+Math.random()*4)*DPR, vy:(3+Math.random()*3)*DPR, life:1
  });
  if(!spStop) setTimeout(spawnMeteor, 2200+Math.random()*3500);
}
setTimeout(spawnMeteor, 2600);

/* ── 指標互動 ── */
const ptr = {x:-9999, y:-9999};
function setPtr(e){
  const t = e.touches ? e.touches[0] : e;
  ptr.x = t.clientX*DPR; ptr.y = t.clientY*DPR;
}
const spOv=document.getElementById("splash");
spOv.addEventListener("mousemove", setPtr, {passive:true});
spOv.addEventListener("touchmove", setPtr, {passive:true});
spOv.addEventListener("touchend", ()=>{ ptr.x=-9999; ptr.y=-9999; });

/* 點擊爆散 */
function boom(e){
  if(e.target.id==="sp-btn") return;
  const t = e.touches ? e.touches[0] : e;
  const bx = t.clientX*DPR, by = t.clientY*DPR;
  const R = 260*DPR;
  for(const p of parts){
    const dx=p.x-bx, dy=p.y-by, d=Math.hypot(dx,dy);
    if(d<R){
      const f=(1-d/R)*(9+Math.random()*7)*DPR;
      p.vx += dx/(d||1)*f; p.vy += dy/(d||1)*f;
    }
  }
  shockwave(bx,by, R*1.25, .5);
}
spOv.addEventListener("pointerdown", boom);

const T0 = performance.now();
let readyFlag=false, blasted=false;

(function loop(now){
  const t = now - T0;

  /* 階段一（星盤）全清屏保持銳利；之後改彗尾疊光 */
  const chartPhase = t < T_VORTEX;
  ctx.globalCompositeOperation = "source-over";
  if(chartPhase){
    ctx.clearRect(0,0,W,H);
  }else{
    ctx.fillStyle = "rgba(22,22,42,0.30)";
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation = "lighter";
  }

  /* 超新星爆發：一次性把粒子往外轟 */
  if(!blasted && t > T_VORTEX){
    blasted = true;
    for(const p of parts){
      const dx=p.x-W/2, dy=p.y-H/2, d=Math.hypot(dx,dy)||1;
      const f=(7+Math.random()*9)*DPR;
      p.vx += dx/d*f; p.vy += dy/d*f;
    }
    shockwave(W/2,H/2, Math.min(W,H)*0.55, .65);
    shockwave(W/2,H/2, Math.min(W,H)*0.34, .4);
  }

  const REPEL = 95*DPR;
  for(const p of parts){
    if(t < T_VORTEX){
      /* 中心光核旋動 */
      const a = p.ca + t*p.sp;
      const pulse = 1 + 0.18*Math.sin(t*0.004 + p.ca);
      p.x = W/2 + Math.cos(a)*p.cr*pulse;
      p.y = H/2 + Math.sin(a)*p.cr*pulse;
    }else if(t < p.d){
      /* 爆發漂移中 */
      p.vx*=0.965; p.vy*=0.965;
      p.x+=p.vx; p.y+=p.vy;
    }else{
      let ax=(p.tx-p.x)*0.02, ay=(p.ty-p.y)*0.02;
      const dx=p.x-ptr.x, dy=p.y-ptr.y, d2=dx*dx+dy*dy;
      if(d2<REPEL*REPEL){
        const d=Math.sqrt(d2)||1, f=(REPEL-d)/REPEL*2.8;
        ax+=dx/d*f; ay+=dy/d*f;
      }
      p.vx=(p.vx+ax)*0.84; p.vy=(p.vy+ay)*0.84;
      p.x+=p.vx; p.y+=p.vy;
    }
    if(chartPhase){
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7);
      ctx.fillStyle=p.c; ctx.globalAlpha=0.95; ctx.fill();
    }else{
      /* 疊光雙層：外暈＋內核 */
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*2.6,0,7);
      ctx.fillStyle=p.c; ctx.globalAlpha=0.10; ctx.fill();
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7);
      ctx.globalAlpha=0.9; ctx.fill();
    }
  }
  ctx.globalAlpha=1;

  /* 固定線紫微星盤：外環/內環/十二宮輻線 + 十四主星（紫微在寅局） */
  if(t < T_VORTEX + 220){
    const R1 = Math.min(W,H)*0.36, R2 = R1*0.5, R3 = R1*0.18;
    const grow = Math.min(1, t/560), ease = 1 - Math.pow(1-grow,3);
    const rot = t*0.00035;
    let alpha = ease;
    let scale = ease;
    if(t > T_VORTEX){                            /* 爆發：放大碎散淡出 */
      const k = (t-T_VORTEX)/220;
      alpha *= Math.max(0, 1-k);
      scale = 1 + k*0.25;
    }
    if(alpha > 0.01){
      ctx.save();
      ctx.translate(W/2, H/2); ctx.rotate(rot); ctx.scale(scale, scale);
      /* 環 */
      const ring = (r, a, w)=>{
        ctx.beginPath(); ctx.arc(0,0,r,0,7);
        ctx.strokeStyle = `rgba(212,175,55,${a*alpha})`;
        ctx.lineWidth = w*DPR; ctx.stroke();
      };
      ring(R1, .6, 1.3); ring(R1*1.035, .22, .7);
      ring(R2, .42, .9); ring(R3, .3, .8);
      /* 十二宮輻線 */
      ctx.strokeStyle = `rgba(212,175,55,${.3*alpha})`;
      ctx.lineWidth = .8*DPR;
      for(let s=0;s<12;s++){
        const a = s/12*Math.PI*2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*R2, Math.sin(a)*R2);
        ctx.lineTo(Math.cos(a)*R1, Math.sin(a)*R1);
        ctx.stroke();
      }
      ctx.restore();
      /* 十四主星入十二宮（紫微在寅局），字保持正立 */
      const SECT = [["破軍"],["天機"],["紫微","天府"],["太陰"],["貪狼"],["巨門"],
                    ["廉貞","天相"],["天梁"],["七殺"],["天同"],["武曲"],["太陽"]];
      const fs = Math.max(11.5*DPR, R1*0.093);
      ctx.font = `700 ${fs}px "Source Han Sans TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      const Rn = (R1+R2)/2 * scale;
      SECT.forEach((names,i)=>{
        const a = (i+0.5)/12*Math.PI*2 - Math.PI/2 + rot;
        const x = W/2 + Math.cos(a)*Rn;
        const y = H/2 + Math.sin(a)*Rn;
        ctx.fillStyle = `rgba(240,225,170,${.9*alpha})`;
        if(names.length===1){
          ctx.fillText(names[0], x, y);
        }else{
          ctx.fillText(names[0], x, y - fs*0.56);
          ctx.fillText(names[1], x, y + fs*0.56);
        }
      });
    }
  }

  /* 衝擊波環 */
  for(let i=waves.length-1;i>=0;i--){
    const w=waves[i];
    w.r += (w.max-w.r)*0.11 + 1.5*DPR;
    const a = w.alpha*(1-w.r/w.max);
    if(a<=0.01){ waves.splice(i,1); continue; }
    ctx.beginPath(); ctx.arc(w.x,w.y,w.r,0,7);
    ctx.strokeStyle=`rgba(255,235,170,${a})`;
    ctx.lineWidth=2*DPR*(1-w.r/w.max)+0.5;
    ctx.stroke();
  }

  /* 流星 */
  for(let i=meteors.length-1;i>=0;i--){
    const m=meteors[i];
    m.x+=m.vx; m.y+=m.vy; m.life-=0.012;
    if(m.life<=0||m.x>W+50||m.y>H+50){ meteors.splice(i,1); continue; }
    const g=ctx.createLinearGradient(m.x,m.y,m.x-m.vx*10,m.y-m.vy*10);
    g.addColorStop(0,`rgba(255,244,200,${0.8*m.life})`);
    g.addColorStop(1,"rgba(255,244,200,0)");
    ctx.strokeStyle=g; ctx.lineWidth=1.4*DPR;
    ctx.beginPath(); ctx.moveTo(m.x,m.y); ctx.lineTo(m.x-m.vx*10,m.y-m.vy*10); ctx.stroke();
  }

  if(!readyFlag && t>2400){ readyFlag=true; document.getElementById("splash").classList.add("ready"); }
  if(!spStop) requestAnimationFrame(loop);
})(T0);

/* 進入：爆散離場 */
document.getElementById("sp-btn").onclick=(e)=>{
  e.stopPropagation();
  for(const p of parts){
    const a=Math.random()*Math.PI*2, f=(4+Math.random()*8)*DPR;
    p.vx+=Math.cos(a)*f; p.vy+=Math.sin(a)*f;
    p.d = 9e9; /* 不再回聚 */
  }
  shockwave(W/2,H*0.44, Math.max(W,H)*0.8, .5);
  const ov = document.getElementById("splash");
  ov.classList.add("leave");
  setTimeout(()=>{ ov.remove(); document.body.style.overflow=""; spStop=true; }, 660);
};
})();
</script>
</body>
